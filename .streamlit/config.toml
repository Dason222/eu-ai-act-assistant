[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
primaryColor = "#111827"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6F8"
textColor = "#111827"
linkColor = "#111827"
borderColor = "#E5E7EB"
baseRadius = "0.5rem"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#FAFAFB"
secondaryBackgroundColor = "#F1F2F4"
