# Single-container configuration for the existing live demo (AODE).
runtime: python:3.12
install: pip install --no-cache-dir --upgrade pip
build: pip install --no-cache-dir . && AIACT_DATA_DIR=/app/data AIACT_MODEL_CACHE_DIR=/app/models aiact-qa ingest
start: exec streamlit run app/ui.py --server.port=${PORT:-8501} --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false
port: 8501
