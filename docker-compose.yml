# Runs behind an EXISTING Traefik reverse proxy (no nginx). Nothing here touches other stacks on the host
# (e.g. n8n): no host ports are published, containers only join Traefik's external network.
#
#   cp .env.example .env   # set AIACT_HOST, TRAEFIK_NETWORK, TRAEFIK_CERT_RESOLVER and an LLM key
#   docker compose up -d --build
#
# UI:  https://${AIACT_HOST}/        API: https://${AIACT_HOST}/api/...  (e.g. /api/health, /api/docs)
# Find your Traefik network / cert resolver:  docker network ls ; docker inspect <traefik-container>

services:
  api:
    build: .
    image: aiact-qa:latest
    restart: unless-stopped
    env_file: .env
    environment:
      AIACT_API_KEY: ${AIACT_API_KEY:?Set a strong AIACT_API_KEY in .env}
    volumes:
      - feedback:/app/data/feedback
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.aiact-api.rule=Host(`${AIACT_HOST}`) && PathPrefix(`/api`)
      - traefik.http.routers.aiact-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.aiact-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.aiact-api.middlewares=aiact-api-strip,aiact-ratelimit
      - traefik.http.middlewares.aiact-api-strip.stripprefix.prefixes=/api
      - traefik.http.middlewares.aiact-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.aiact-ratelimit.ratelimit.burst=40
      - traefik.http.services.aiact-api.loadbalancer.server.port=8000

  ui:
    image: aiact-qa:latest
    depends_on: [api]
    restart: unless-stopped
    env_file: .env
    environment:
      AIACT_UI_PASSWORD: ${AIACT_UI_PASSWORD:?Set AIACT_UI_PASSWORD in .env}
    command: ["streamlit", "run", "app/ui.py", "--server.port=8501", "--server.address=0.0.0.0",
              "--server.headless=true", "--browser.gatherUsageStats=false"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
    volumes:
      - feedback:/app/data/feedback
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.aiact-ui.rule=Host(`${AIACT_HOST}`)
      - traefik.http.routers.aiact-ui.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.aiact-ui.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.routers.aiact-ui.priority=1
      - traefik.http.routers.aiact-ui.middlewares=aiact-ui-ratelimit
      - traefik.http.middlewares.aiact-ui-ratelimit.ratelimit.average=10
      - traefik.http.middlewares.aiact-ui-ratelimit.ratelimit.burst=20
      - traefik.http.services.aiact-ui.loadbalancer.server.port=8501

volumes:
  feedback:

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
