[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiact-qa"
version = "0.1.0"
description = "Natural-language Q&A over the EU AI Act (Regulation (EU) 2024/1689): structure-aware RAG with cited, grounded answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.13",
    "openai>=1.60",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.26",
    "fastembed>=0.9",
    "snowballstemmer>=2.2",
    "requests>=2.31",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
notebook = ["jupyter>=1.0", "nbconvert>=7", "ipykernel>=6", "matplotlib>=3.8", "pandas>=2.1"]

[project.scripts]
aiact-qa = "aiact_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::bs4.XMLParsedAsHTMLWarning"]
markers = [
    "integration: needs the full regulation snapshot and the local embedding model",
    "live: calls the Anthropic API (needs ANTHROPIC_API_KEY)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
